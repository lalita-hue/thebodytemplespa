<style>
#glp-countdown{
  --cd-text:#F6F0FA; --cd-muted:#C2B9DC; --cd-violet:#B9A2F5; --cd-sunset:#FF8A3D;
  --cd-glass:rgba(32,28,78,.72); --cd-line:rgba(185,162,245,.22);
  --cd-cta:linear-gradient(120deg,#FF8A3D 0%,#F2557A 100%);
  --cd-serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --cd-sans:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:
    radial-gradient(ellipse 70% 45% at 88% 0%,rgba(255,128,52,.42),transparent 70%),
    radial-gradient(ellipse 55% 40% at 8% 18%,rgba(176,148,255,.30),transparent 70%),
    radial-gradient(ellipse 60% 40% at 70% 100%,rgba(242,85,122,.20),transparent 70%),
    linear-gradient(180deg,#1C1A50 0%,#120F31 100%);
  color:var(--cd-text); font-family:var(--cd-sans); font-size:16px; line-height:1.6;
  padding:48px 16px 28px; box-sizing:border-box; width:100%; text-align:center;
  -webkit-font-smoothing:antialiased; color-scheme:dark;
}
#glp-countdown *,#glp-countdown *::before,#glp-countdown *::after{box-sizing:border-box;}
#glp-countdown .cd-wrap{max-width:720px;margin:0 auto;}
#glp-countdown .cd-fly{display:block;margin:0 auto 18px;width:130px;max-width:50%;height:auto;filter:drop-shadow(0 0 18px rgba(255,170,110,.35));}
#glp-countdown .cd-eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#FFA86B;font-weight:600;margin:0 0 12px;}
#glp-countdown h1{font-family:var(--cd-serif);color:#fff;font-weight:600;line-height:1.12;margin:0 0 12px;font-size:clamp(32px,6vw,50px);text-wrap:balance;}
#glp-countdown h1 em{font-style:italic;background:linear-gradient(100deg,#C9B4FF,#FF9A5C);-webkit-background-clip:text;background-clip:text;color:transparent;}
#glp-countdown .cd-when{color:var(--cd-muted);font-size:clamp(15px,2.4vw,18px);margin:0 0 28px;}
#glp-countdown .cd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 auto 30px;max-width:560px;}
#glp-countdown .cd-unit{background:var(--cd-glass);border:1px solid var(--cd-line);border-radius:18px;padding:18px 6px 14px;
  box-shadow:0 24px 60px -24px rgba(5,4,25,.8);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);}
#glp-countdown .cd-num{display:block;font-family:var(--cd-serif);font-weight:700;font-size:clamp(36px,9vw,60px);line-height:1;color:#fff;font-variant-numeric:lining-nums tabular-nums;}
#glp-countdown .cd-label{display:block;margin-top:8px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--cd-violet);font-weight:600;}
#glp-countdown .cd-live{display:none;font-family:var(--cd-serif);font-size:clamp(26px,5vw,36px);color:#fff;margin:0 0 26px;}
#glp-countdown.is-live .cd-grid{display:none;}
#glp-countdown.is-live .cd-live{display:block;}
#glp-countdown .cd-btn{display:inline-flex;align-items:center;justify-content:center;background:var(--cd-cta);color:#fff;border-radius:999px;
  padding:17px 34px;font-size:16px;font-weight:600;letter-spacing:.02em;text-decoration:none;min-height:52px;
  box-shadow:0 10px 30px -10px rgba(255,120,70,.8);transition:filter .25s ease,transform .2s ease;}
#glp-countdown .cd-btn:hover{filter:brightness(1.08);transform:translateY(-2px);}
#glp-countdown .cd-btn:focus-visible{outline:3px solid var(--cd-violet);outline-offset:3px;}
#glp-countdown .cd-foot{margin-top:40px;font-size:13px;color:var(--cd-muted);}
#glp-countdown .cd-foot strong{display:block;font-family:var(--cd-serif);font-style:italic;font-size:20px;color:#FFA86B;font-weight:500;margin-bottom:4px;}
@media (max-width:420px){#glp-countdown .cd-grid{gap:8px;}#glp-countdown .cd-unit{border-radius:14px;padding:14px 2px 10px;}#glp-countdown .cd-label{font-size:10px;letter-spacing:.1em;}}
</style>
