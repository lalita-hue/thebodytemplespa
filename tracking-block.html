     WHAT THE LYMPHATIC PAGE DOES, AND WHY IT WORKS

     index.html            GTM in <head>, noscript after <body>. A custom
                           HTML form posts to a GoHighLevel webhook by
                           fetch. On success it stashes the lead's identity
                           in sessionStorage under "btw_lead", pushes
                           form_submission, then redirects to /thank-you
                           carrying the query string forward.

     thankyou.html         GTM again. Reads btw_lead back out of
                           sessionStorage and pushes
                           form_submission_confirmation with conversion:true.
                           That push is the conversion — GTM hashes the
                           email and phone client-side for Google Ads
                           Enhanced Conversions.

     The reason it is split across two pages: the thank-you page can only
     be reached by actually submitting, so it cannot fire on a bounce or a
     double-submit. That is worth preserving.

     ─────────────────────────────────────────────────────────────────────
     THE ONE DIFFERENCE ON THIS PAGE — READ THIS

     The lymphatic page owns its form fields, so it can read the email and
     phone. The facials page embeds GoHighLevel form GvYWzh4i8sNtH7TCsjp5
     in an iframe. That iframe is cross-origin: this page cannot read a
     single character the visitor types into it. No workaround exists —
     that is the browser's same-origin policy, not a GHL limitation.

     So Enhanced Conversions cannot work the way it does on the lymphatic
     page unless you do ONE of these two things:

       OPTION A (recommended, matches the lymphatic funnel exactly)
       In GoHighLevel, open form GvYWzh4i8sNtH7TCsjp5 → Settings →
       On Submit → Redirect, and point it at your facials thank-you page
       — the .btspa-ty page with the price list and Reserve buttons.
       GHL appends the submitted field values to that URL. PART 4 below
       reads them, writes btw_lead, and fires
       form_submission_confirmation with conversion:true — identical to
       the lymphatic thank-you page.

       OPTION B (no redirect)
       Leave the form as an in-page modal. PART 3 still fires
       form_submission on submit, but with no email or phone, so Enhanced
       Conversions has nothing to hash. Count the conversion from a GHL
       workflow instead of from the browser.

     Do not skip this. Without A or B, the facials page will report opens
     and clicks but never a clean conversion.

       PART 1 → <head>, as high as possible        GHL: Tracking Code → Header

<script>
(function(){
  'use strict';

  /* Same page identity the lymphatic page uses in its GHL tags. */
  var PAGE_SOURCE = 'lp-facials-athens';
  var FORM_ID     = 'GvYWzh4i8sNtH7TCsjp5';

  var dl = function(o){
    try { (window.dataLayer = window.dataLayer || []).push(o); } catch(e){}
  };
  var fired = {};
  var once = function(k, o){ if(fired[k]) return; fired[k] = true; dl(o); };

  /* ── getUTMs — identical to index.html ─────────────────────────────── */
  function getUTMs(){
    var out = {};
    try {
      var p = new URLSearchParams(window.location.search);
      ['utm_source','utm_medium','utm_campaign','utm_term','utm_content','gclid','fbclid']
        .forEach(function(k){ if(p.get(k)) out[k] = p.get(k); });
    } catch(e){}
    return out;
  }

  /* Persist attribution for the whole session, so a lead that submits on a
     later pageview is still credited to the ad that brought them in. The
     lymphatic page reads UTMs off the current URL only; this survives
     internal navigation. */
  var ATTR_KEY = 'btw_attr';
  function attribution(){
    var live = getUTMs();
    try {
      if(Object.keys(live).length){
        sessionStorage.setItem(ATTR_KEY, JSON.stringify(live));
        return live;
      }
      return JSON.parse(sessionStorage.getItem(ATTR_KEY) || '{}');
    } catch(e){ return live; }
  }

  function init(){

    /* ── window._lastCta — identical to index.html ───────────────────────
       Whichever CTA opened the modal is remembered, so the submit can be
       attributed to it. The facials page already has data-cta on every
       trigger, so this needs no markup changes. */
    window._lastCta = 'Direct';
    document.querySelectorAll('.popup-trigger').forEach(function(b){
      b.addEventListener('click', function(){
        window._lastCta = b.dataset.cta || 'Unknown';
      });
    });

    /* Your page already pushes lead_form_open and menu_jump. Both are left
       alone so nothing double-counts. */

    /* ── form_submission ─────────────────────────────────────────────────
       Same event name and cta_source field as the lymphatic page. The PII
       fields the lymphatic page sends are absent here and that is not an
       omission — see the note at the top of this file. */
    window.addEventListener('message', function(e){
      var host = '';
      try { host = new URL(e.origin).hostname; } catch(err){ return; }
      if(!/(^|\.)leadconnectorhq\.com$/.test(host)) return;

      var d = e.data;
      var probe = String((d && (d.type || d.event || d.action)) || '') + ' ' +
                  (typeof d === 'string' ? d : '');
      if(!/submit|submitted|success|form_complete/i.test(probe)) return;

      var payload = {
        event: 'form_submission',
        form_id: FORM_ID,
        source: PAGE_SOURCE,
        cta_source: window._lastCta || 'Unknown',
        page_url: location.href,
        page_path: location.pathname,
        referrer: document.referrer || '',
        submitted_at: new Date().toISOString()
      };
      var a = attribution();
      Object.keys(a).forEach(function(k){ payload[k] = a[k]; });
      once('submitted', payload);
    }, false);

    /* ── lead_form_abandon ───────────────────────────────────────────────
       Not on the lymphatic page, but the most useful signal this page can
       produce: it separates "never interested" from "interested, then
       something stopped them". */
    var modal = document.getElementById('leadModal');
    if(modal && 'MutationObserver' in window){
      var wasOpen = modal.classList.contains('is-open'), openedAt = 0;
      new MutationObserver(function(){
        var isOpen = modal.classList.contains('is-open');
        if(isOpen && !wasOpen){
          openedAt = Date.now();
        } else if(!isOpen && wasOpen && !fired.submitted){
          dl({ event:'lead_form_abandon', source:PAGE_SOURCE,
               cta_source: window._lastCta || 'Unknown',
               seconds_open: Math.round((Date.now() - openedAt)/1000) });
        }
        wasOpen = isOpen;
      }).observe(modal, { attributes:true, attributeFilter:['class'] });
    }

    /* ── phone_click ─────────────────────────────────────────────────────
       Split by placement, because these are different people. A sticky-bar
       tap on mobile is the highest-intent action on the page. */
    document.querySelectorAll('a[href^="tel:"]').forEach(function(a){
      a.addEventListener('click', function(){
        var where = 'other';
        if(a.closest('.stickybar'))   where = 'sticky_bar';
        else if(a.closest('.header')) where = 'header';
        else if(a.closest('.faq'))    where = 'faq';
        else if(a.closest('.footer')) where = 'footer';
        dl({ event:'phone_click', source:PAGE_SOURCE, cta_location:where });
      });
    });

    document.querySelectorAll('a[href^="mailto:"]').forEach(function(a){
      a.addEventListener('click', function(){
        dl({ event:'email_click', source:PAGE_SOURCE });
      });
    });

    /* ── faq_open — which questions the page failed to answer earlier ── */
    document.querySelectorAll('.faq__item').forEach(function(d){
      d.addEventListener('toggle', function(){
        if(!d.open) return;
        var s = d.querySelector('.faq__btn');
        dl({ event:'faq_open', source:PAGE_SOURCE,
             faq_question: s ? s.textContent.replace(/\s*\+\s*$/,'').trim() : '' });
      });
    });

    /* ── scroll_depth ── */
    var onScroll = function(){
      var scrollable = document.documentElement.scrollHeight - window.innerHeight;
      if(scrollable <= 0) return;
      var pct = Math.round((window.pageYOffset / scrollable) * 100);
      [25,50,75,90].forEach(function(m){
        if(pct >= m) once('s'+m, { event:'scroll_depth', source:PAGE_SOURCE, percent:m });
      });
      if(pct >= 90) window.removeEventListener('scroll', onScroll);
    };
    window.addEventListener('scroll', onScroll, { passive:true });
    onScroll();

    /* ── section_view — where readers stop ── */
    var sections = {
      '#concerns':'skin_concerns', '#menu':'service_menu',
      '#how-it-works':'process', '.brochure':'brochure',
      '.whycards':'why_choose', '.tband':'testimonials',
      '.spatour':'spa_tour', '#more-reviews':'extended_reviews', '.faq':'faq'
    };
    if('IntersectionObserver' in window){
      var sio = new IntersectionObserver(function(es){
        es.forEach(function(en){
          if(!en.isIntersecting) return;
          var n = en.target.getAttribute('data-track-section');
          once('sec_'+n, { event:'section_view', source:PAGE_SOURCE, section:n });
          sio.unobserve(en.target);
        });
      }, { threshold:0.5 });
      Object.keys(sections).forEach(function(sel){
        var el = document.querySelector(sel);
        if(!el) return;
        el.setAttribute('data-track-section', sections[sel]);
        sio.observe(el);
      });
    }

    /* ── engaged_time — counted only while the tab is visible ── */
    var secs = 0, timer = null;
    var tick = function(){
      secs++;
      [30,60,120].forEach(function(m){
        if(secs === m) once('t'+m, { event:'engaged_time', source:PAGE_SOURCE, seconds:m });
      });
      if(secs >= 120 && timer){ clearInterval(timer); timer = null; }
    };
    var start = function(){ if(!timer) timer = setInterval(tick, 1000); };
    var stop  = function(){ if(timer){ clearInterval(timer); timer = null; } };
    if(document.visibilityState === 'visible') start();
    document.addEventListener('visibilitychange', function(){
      document.visibilityState === 'visible' ? start() : stop();
    });

    /* ── video_play ── */
    document.querySelectorAll('video').forEach(function(v){
      var label = v.classList.contains('hero__video') ? 'hero_room'
                : v.classList.contains('spatour__video') ? 'spa_tour' : 'other';
      v.addEventListener('play', function(){
        once('vid_'+label, { event:'video_play', source:PAGE_SOURCE, video:label });
      });
    });

    /* ── exit_intent, desktop only ── */
    document.addEventListener('mouseout', function(e){
      if(e.clientY > 0 || e.relatedTarget) return;
      once('exit', { event:'exit_intent', source:PAGE_SOURCE });
    });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else { init(); }
})();
</script>


<!-- ══════════════════════════════════════════════════════════════════════
     PART 4 — THE FACIALS THANK-YOU PAGE (.btspa-ty)

     Put PARTS 1 and 2 on this page too, then this block after the markup.

     This page does two jobs and both need tracking:

       1. It is the conversion confirmation. Reached only by submitting,
          so it cannot fire on a bounce — same logic as the lymphatic
          thank-you page. Fires form_submission_confirmation.

       2. It is a booking page. Nine Reserve buttons to GHL calendars and
          nine Text-to-Book links. THESE ARE THE REAL MONEY EVENTS on the
          whole funnel — a lead form submit is interest, a calendar click
          is intent, and right now nothing counts them. Fires
          booking_click and sms_to_book with the service and price.
     ══════════════════════════════════════════════════════════════════════ -->

<script>
(function(){
  'use strict';
  window.dataLayer = window.dataLayer || [];
  var dl = function(o){ try { window.dataLayer.push(o); } catch(e){} };

  /* ── 1. THE CONVERSION ─────────────────────────────────────────────────
     sessionStorage first, same btw_lead key the lymphatic funnel writes.
     Falls back to the redirect query string, because when GoHighLevel
     redirects after a form submit it appends the submitted values — which
     is the only way the facials funnel can get Enhanced Conversions, since
     the form itself is a cross-origin iframe this page cannot read. */
  function fromUrl(){
    var p;
    try { p = new URLSearchParams(location.search); } catch(e){ return {}; }
    var pick = function(names){
      for(var i=0;i<names.length;i++){
        var v = p.get(names[i]);
        if(v) return v.trim();
      }
      return '';
    };
    var first = pick(['first_name','firstName','fname','first']);
    var last  = pick(['last_name','lastName','lname','last']);
    var full  = pick(['name','full_name','user_name']);
    return {
      user_email: pick(['email','user_email','Email']),
      user_phone: pick(['phone','user_phone','Phone']),
      user_name : full || (first + ' ' + last).trim()
    };
  }

  /* E.164, matching phoneToE164 in index.html, so Google Ads matches these
     against the same format the lymphatic funnel already sends. */
  function toE164(v){
    var d = String(v || '').replace(/\D/g,'');
    if(d.length === 10) return '+1' + d;
    if(d.length === 11 && d[0] === '1') return '+' + d;
    return v || '';
  }

  var lead = {};
  try { lead = JSON.parse(sessionStorage.getItem('btw_lead') || '{}'); } catch(e){}
  var url = fromUrl();
  ['user_email','user_phone','user_name'].forEach(function(k){
    if(!lead[k] && url[k]) lead[k] = url[k];
  });
  if(lead.user_phone) lead.user_phone = toE164(lead.user_phone);
  try {
    if(lead.user_email || lead.user_phone) sessionStorage.setItem('btw_lead', JSON.stringify(lead));
  } catch(e){}

  /* Attribution: prefer live UTMs on this URL — a GoHighLevel redirect can
     land here carrying them — and fall back to what the landing page
     stashed. Persist either way so booking_click below is credited too. */
  var attr = (function(){
    var live = {};
    try {
      var q = new URLSearchParams(location.search);
      ['utm_source','utm_medium','utm_campaign','utm_term','utm_content','gclid','fbclid']
        .forEach(function(k){ if(q.get(k)) live[k] = q.get(k); });
    } catch(e){}
    var saved = {};
    try { saved = JSON.parse(sessionStorage.getItem('btw_attr') || '{}'); } catch(e){}
    var merged = {};
    Object.keys(saved).forEach(function(k){ merged[k] = saved[k]; });
    Object.keys(live).forEach(function(k){ merged[k] = live[k]; });
    try {
      if(Object.keys(merged).length) sessionStorage.setItem('btw_attr', JSON.stringify(merged));
    } catch(e){}
    return merged;
  })();

  var conv = {
    event: 'form_submission_confirmation',
    user_email: lead.user_email || '',
    user_phone: lead.user_phone || '',
    user_name : lead.user_name  || '',
    page_path : '/facials-thank-you',
    source    : 'lp-facials-athens',
    conversion: true
  };
  Object.keys(attr).forEach(function(k){ conv[k] = attr[k]; });
  dl(conv);

  /* The same two placeholders thankyou.html carries. They only run if
     gtag.js or the Meta pixel is loaded directly rather than through GTM.
     If your Ads and Meta tags live in GTM — the cleaner setup — leave
     these and trigger off form_submission_confirmation there instead. */
  if(typeof gtag === 'function'){
    gtag('event','conversion',{
      'send_to':'AW-CONVERSION_ID/CONVERSION_LABEL',
      'value':1.0, 'currency':'USD'
    });
  }
  if(typeof fbq === 'function'){ fbq('track','Lead'); }

  /* ── 2. BOOKING AND TEXT-TO-BOOK CLICKS ──────────────────────────────── */
  function init(){
    var root = document.querySelector('.btspa-ty') || document;

    /* Read the service name, price and duration straight out of the row the
       button sits in, so adding a service to the menu needs no code change. */
    function rowInfo(el){
      var row = el.closest('.price-item');
      var get = function(sel){
        var n = row && row.querySelector(sel);
        return n ? n.textContent.trim() : '';
      };
      var priceEl = row && row.querySelector('.price');
      var unit = get('.unit');
      var price = priceEl ? priceEl.textContent.replace(unit, '').trim() : '';
      var value = parseFloat(String(price).replace(/[^0-9.]/g,''));
      return {
        service : get('.service-name'),
        badge   : get('.badge'),
        price   : price,
        duration: unit.replace(/^\/\s*/,'').trim(),
        value   : isFinite(value) ? value : 0,
        featured: !!(row && row.classList.contains('featured'))
      };
    }

    root.querySelectorAll('.btn-book').forEach(function(a){
      a.addEventListener('click', function(){
        var i = rowInfo(a);
        var p = {
          event:'booking_click', source:'lp-facials-athens',
          service:i.service, service_badge:i.badge,
          price:i.price, duration:i.duration,
          value:i.value, currency:'USD', featured:i.featured,
          calendar_url:a.getAttribute('href') || ''
        };
        Object.keys(attr).forEach(function(k){ p[k] = attr[k]; });
        dl(p);
      });
    });

    root.querySelectorAll('.btn-text').forEach(function(a){
      a.addEventListener('click', function(){
        var i = rowInfo(a);
        var p = {
          event:'sms_to_book', source:'lp-facials-athens',
          service:i.service, price:i.price, duration:i.duration,
          value:i.value, currency:'USD'
        };
        Object.keys(attr).forEach(function(k){ p[k] = attr[k]; });
        dl(p);
      });
    });

    /* Which services people actually read. Tells you what to move to the
       top of the list, and what the ad should have promised. */
    if('IntersectionObserver' in window){
      var seen = {};
      var io = new IntersectionObserver(function(es){
        es.forEach(function(en){
          if(!en.isIntersecting) return;
          var n = en.target.querySelector('.service-name');
          var name = n ? n.textContent.trim() : '';
          if(!name || seen[name]) return;
          seen[name] = true;
          dl({ event:'service_view', source:'lp-facials-athens', service:name });
          io.unobserve(en.target);
        });
      }, { threshold:0.6 });
      root.querySelectorAll('.price-item').forEach(function(r){ io.observe(r); });
    }

    root.querySelectorAll('a[href^="tel:"]').forEach(function(a){
      a.addEventListener('click', function(){
        dl({ event:'phone_click', source:'lp-facials-athens', cta_location:'thank_you' });
      });
    });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else { init(); }
})();
</script>


<!-- ══════════════════════════════════════════════════════════════════════
     EVENTS

     Matching the lymphatic page exactly
       form_submission                 cta_source, source, page_url,
                                       page_path, referrer, submitted_at,
                                       plus utm_* / gclid / fbclid
       form_submission_confirmation    user_email, user_phone, user_name,
                                       page_path, conversion:true
       lead_form_open                  already on your page, untouched
       menu_jump                       already on your page, untouched

     Added here
       lead_form_abandon    modal closed with no submit, plus seconds_open
       phone_click          cta_location: sticky_bar / header / faq / footer
       email_click
       faq_open             with the question text
       scroll_depth         25 / 50 / 75 / 90
       section_view         nine named sections, once each
       engaged_time         30 / 60 / 120 seconds of visible time
       video_play           hero_room / spa_tour
       exit_intent          desktop pointer left the top of the viewport

     On the thank-you page
       booking_click        service, badge, price, duration, value,
                            currency, featured, calendar_url
       sms_to_book          service, price, duration, value, currency
       service_view         which services were actually read

     IN GTM
       Your form_submission and form_submission_confirmation triggers

       for cta_location, faq_question, percent, section, seconds, video,

       booking_click is the one to send to Google Ads as a second

     TWO THINGS THE LYMPHATIC PAGES ALSO NEED
       1. privacy.html and terms.html carry no GTM at all. They are linked
